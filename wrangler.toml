name = "exoskeletoninjuries-com-v1"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# Static assets + Worker for one-hop canonical redirects (www/http/index.html)
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "force-trailing-slash"
run_worker_first = true

[observability]
enabled = true
